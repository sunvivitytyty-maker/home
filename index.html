<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>신휴의 멋진 홈페이지</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: '맑은 고딕', sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #d53f8c;
            font-size: 36px;
        }
        p {
            color: #4a5568;
            font-size: 20px;
        }
        .box {
            background-color: white;
            width: 60%;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        img {
            margin: 20px 0;
            border-radius: 15px;
            width: 250px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✨ 신휴의 홈페이지에 오신 것을 환영합니다! ✨</h1>
        
        <!-- 잔망루피 사진 불러오기 (깃허브에 올릴 파일명 잔망루피.png 와 똑같아야 합니다) -->
        <img src="잔망루피.png" alt="잔망루피 사진">
        
        <p>제 홈페이지 마스코트 잔망루피입니다!</p>
        <p>이곳은 신휴가 직접 만든 멋진 비밀 공간이에요 🚀</p>
        <p>앞으로 재밌는 자료와 글을 여기에 올릴 예정입니다!</p>
    </div>
</body>
</html>
