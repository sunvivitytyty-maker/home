<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>신휴의 멋진 홈페이지</title>
    <style>
        body {
            background-color: #f0f8ff;
            font-family: '맑은 고딕', sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #2b6cb0;
            font-size: 36px;
        }
        p {
            color: #4a5568;
            font-size: 20px;
        }
        .box {
            background-color: white;
            width: 60%;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>✨ 신휴의 홈페이지에 오신 것을 환영합니다! ✨</h1>
        <p>이곳은 신휴가 직접 만든 멋진 비밀 공간이에요 🚀</p>
        <p>앞으로 재밌는 자료와 글을 여기에 올릴 예정입니다!</p>
    </div>
</body>
</html>
